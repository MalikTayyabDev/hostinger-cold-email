{% extends "auth_base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h1>Create account</h1>
<p class="subtitle">Sign up, connect your email, and start sending.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-row">
    <label>Username</label>
    <input name="username" required autofocus autocomplete="username">
  </div>
  <div class="form-row">
    <label>Password</label>
    <input name="password" type="password" required minlength="8" autocomplete="new-password">
    <span class="hint">At least 8 characters</span>
  </div>
  <div class="form-row">
    <label>Confirm password</label>
    <input name="password_confirm" type="password" required minlength="8" autocomplete="new-password">
  </div>
  <button class="btn btn-primary btn-block" type="submit">Create account</button>
</form>
<p class="hint" style="text-align:center;margin-top:20px;margin-bottom:0">
  Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
</p>
{% endblock %}
