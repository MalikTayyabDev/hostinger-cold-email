{% extends "base.html" %}
{% block title %}Edit {{ campaign.name }}{% endblock %}
{% block content %}
<h1>Edit Campaign</h1>
<div class="card">
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-row"><label>Name</label><input name="name" value="{{ campaign.name }}" required></div>
  <div class="form-row"><label>Description</label><textarea name="description">{{ campaign.description or '' }}</textarea></div>
  <div class="grid grid-3">
    <div class="form-row"><label>Daily send limit (blank = global)</label><input name="daily_send_limit" type="number" value="{{ campaign.daily_send_limit or '' }}"></div>
    <div class="form-row"><label>Min delay (sec)</label><input name="delay_min_seconds" type="number" value="{{ campaign.delay_min_seconds or '' }}"></div>
    <div class="form-row"><label>Max delay (sec)</label><input name="delay_max_seconds" type="number" value="{{ campaign.delay_max_seconds or '' }}"></div>
  </div>

  <h3 style="margin-top:24px">Sequence Steps</h3>
  {% for s in steps %}
  <div class="card" style="background:#f9fafb">
    <input type="hidden" name="step_number" value="{{ s.step_number }}">
    <div class="form-row"><label>Step {{ s.step_number }} — Subject</label><input name="subject" value="{{ s.subject }}"></div>
    <div class="form-row"><label>Body</label><textarea name="body" rows="8">{{ s.body }}</textarea></div>
    <div class="form-inline">
      <div class="form-row" style="flex:1"><label>Delay after previous (days)</label><input name="delay_days" type="number" value="{{ s.delay_days }}" style="width:100px"></div>
      <label><input type="checkbox" name="enabled_{{ s.step_number }}" value="1" {% if s.enabled %}checked{% endif %}> Enabled</label>
    </div>
  </div>
  {% endfor %}

  <button class="btn btn-primary" type="submit">Save Campaign</button>
  <a class="btn btn-secondary" href="{{ url_for('campaigns.detail', campaign_id=campaign.id) }}">Cancel</a>
</form>
</div>
{% endblock %}
