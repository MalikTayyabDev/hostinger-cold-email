{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="subtitle">Welcome back — log in to your account.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-row">
    <label>Username</label>
    <input name="username" required autofocus autocomplete="username">
  </div>
  <div class="form-row">
    <label>Password</label>
    <input name="password" type="password" required autocomplete="current-password">
  </div>
  <button class="btn btn-primary btn-block" type="submit">Sign in</button>
</form>
{% if allow_signup %}
<p class="hint" style="text-align:center;margin-top:20px;margin-bottom:0">
  No account? <a href="{{ url_for('auth.register') }}">Create one free</a>
</p>
{% endif %}
{% endblock %}
