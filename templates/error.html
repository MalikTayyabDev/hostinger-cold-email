<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or 'Error' }} — Cold Email</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-shell">
  <div style="width:100%;max-width:480px">
    <div class="auth-brand">
      <h2>Cold Email</h2>
    </div>
    <div class="auth-card">
      <h1 style="margin-top:0">{{ title or 'Something went wrong' }}</h1>
      <p>{{ message or 'Please try again. If this keeps happening, check Vercel logs.' }}</p>
      <p style="margin-bottom:0">
        <a class="btn btn-primary" href="/login">Sign in</a>
        <a class="btn btn-secondary" href="/health" style="margin-left:8px">Health check</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
